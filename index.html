<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sonolumina</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e9e2cf;
    font-family: Georgia, 'Times New Roman', serif; }
  body { display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.4rem; padding: 1.5rem; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; user-select: none; }
  h1 { font-weight: normal; letter-spacing: .3em; font-size: .85rem;
    opacity: .55; margin: 0; text-transform: uppercase; }
  canvas { width: min(78vw, 46vh); aspect-ratio: 1; border-radius: 50%; }
  #verse { max-width: 32rem; text-align: center; font-size: 1.15rem;
    line-height: 1.6; min-height: 5.2em; transition: opacity 2s; }
  #ref { display: block; margin-top: .5rem; font-size: .8rem; opacity: .6; }
  #state { font: .8rem system-ui, sans-serif; opacity: .7; letter-spacing: .04em; min-height: 1.2em; }
  #labels { font: .72rem/1.5 system-ui, sans-serif; opacity: .45; text-align: center; }
  #verse span.now { color: #fff3c4; text-shadow: 0 0 .6em rgba(255,220,140,.6); }
  #verse span { transition: color .25s; }
  #controls { display: flex; gap: .8rem; }
  #controls button { font: .9rem system-ui, sans-serif; color: #e9e2cf; background: #15130f;
    border: 1px solid #3a352a; border-radius: 2rem; padding: .7rem 1.4rem; min-width: 7rem; }
  #controls button:active { background: #24201a; }
</style>
</head>
<body>
  <h1>Sonolumina</h1>
  <canvas id="dish" width="200" height="200" aria-hidden="true"></canvas>
  <p id="verse" aria-live="polite"></p>
  <div id="state"></div>
  <div id="labels"></div>
  <div id="controls">
    <button id="play" type="button">Begin</button>
    <button id="voice" type="button" aria-pressed="true">Voice on</button>
  </div>
<script type="module">
  import { LABELS } from './law/home.js';
  import { EMOTION_SOURCE, feeling } from './law/emotion.js';
  import { createEngine } from './form/engine.js';
  import { createDish } from './form/dish.js';
  import { createPlayer } from './form/player.js';
  import { createNarrator } from './form/narrator.js';

  const el = id => document.getElementById(id);
  const [gen, cb, vad] = await Promise.all([
    fetch('./data/bsb/Genesis.json').then(r => r.json()),
    fetch('./data/codebook/eng.json').then(r => r.json()),
    fetch('./data/vad/Genesis.json').then(r => r.json()),
  ]);
  const chapter = gen.c[0];
  const engine = createEngine();
  // Light for the season: hue from valence (cool blue at sorrow, warm gold at joy).
  let hue = 45;
  const hsl = (h, s, l) => {
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  };
  createDish(el('dish'), engine, () => hsl(hue, 0.55, 0.78));
  window.__sono = engine;   // for smoke tests

  let spans = [];
  const p = el('verse');
  const showVerse = (v, words, E, k) => {
    if (k) {
      hue = k.hue;
      el('state').textContent = `${k.mode} · ${Math.round(k.bpm)} BPM · ${feeling(E)}`;
    }
    p.innerHTML = '';
    spans = words.map((w, i) => {
      const s = document.createElement('span');
      s.textContent = w;
      p.append(s, i < words.length - 1 ? ' ' : '');
      return s;
    });
    const r = document.createElement('span');
    r.id = 'ref'; r.textContent = `Genesis 1:${v} · BSB`;
    p.append(r);
  };
  showVerse(2, chapter[1].split(/\s+/));   // before the first tap: darkness over the deep

  const narrator = createNarrator();
  const voiceBtn = el('voice'), playBtn = el('play');
  const setVoice = on => {
    narrator.on = on;
    voiceBtn.textContent = narrator.on ? 'Voice on' : 'Voice off';
    voiceBtn.setAttribute('aria-pressed', narrator.on);
  };
  if (!narrator.available) { voiceBtn.disabled = true; voiceBtn.textContent = 'No voice'; }
  voiceBtn.onclick = () => setVoice(!narrator.on);

  // Keep the screen awake while reading.
  let lock = null;
  const wake = async on => {
    try {
      if (on && !lock && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen');
      if (!on && lock) { await lock.release(); lock = null; }
    } catch { lock = null; }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && player && !player.paused && state === 'playing') { lock = null; wake(true); }
  });

  let player = null, state = 'ready';
  playBtn.onclick = () => {
    if (state === 'ready') {
      state = 'playing';
      playBtn.textContent = 'Pause';
      el('labels').innerHTML = [LABELS.F0, LABELS.WORD, EMOTION_SOURCE, LABELS.DISH].join('<br>');
      player = createPlayer({
        engine, lex: cb.lex, vadBook: vad, chapter: 1, chapterText: chapter,
        narrating: () => narrator.on,
        onVerse: (v, words, E, k, vs) => {
          showVerse(v, words, E, k);
          narrator.speak(words.join(' '), words.length / (vs.dur / 60));
        },
        onWord: (v, i) => { spans.forEach((s, j) => s.className = j === i ? 'now' : ''); },
        onClose: () => {
          // Rest. The chapter has come home; then the seventh day (Genesis 2:2, from the data).
          spans.forEach(s => s.className = '');
          el('state').textContent = 'Amen · IV–I · home 110 Hz';
          setTimeout(() => {
            p.style.opacity = 0;
            setTimeout(() => {
              p.innerHTML = '';
              p.append(gen.c[1][1]);
              const r = document.createElement('span');
              r.id = 'ref'; r.textContent = 'Genesis 2:2 · BSB';
              p.append(r);
              p.style.opacity = 1;
            }, 2000);
          }, 2500);
        },
        onEnd: () => { state = 'ready'; playBtn.textContent = 'Begin again'; wake(false); },
      });
      player.play();
      wake(true);
    } else if (state === 'playing') {
      state = 'paused'; playBtn.textContent = 'Resume';
      player.pause(); narrator.pause(); wake(false);
    } else if (state === 'paused') {
      state = 'playing'; playBtn.textContent = 'Pause';
      player.resume(); narrator.resume(); wake(true);
    }
  };
</script>
</body>
</html>
