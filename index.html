<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sonolumina</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e9e2cf;
    font-family: Georgia, 'Times New Roman', serif; }
  body { display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.4rem; padding: 1.5rem; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; user-select: none; }
  h1 { font-weight: normal; letter-spacing: .3em; font-size: .85rem;
    opacity: .55; margin: 0; text-transform: uppercase; }
  canvas { width: min(78vw, 46vh); aspect-ratio: 1; border-radius: 50%; }
  #verse { max-width: 32rem; text-align: center; font-size: 1.15rem;
    line-height: 1.6; min-height: 5.2em; transition: opacity 2s; }
  #heading { display: block; margin-bottom: .5rem; font-size: .85rem; font-style: italic; opacity: .6; }
  #ref { display: block; margin-top: .5rem; font-size: .8rem; opacity: .6; }
  #state { font: .8rem system-ui, sans-serif; opacity: .7; letter-spacing: .04em; min-height: 1.2em; }
  #labels { font: .72rem/1.5 system-ui, sans-serif; opacity: .45; text-align: center; }
  #verse span.now { color: #fff3c4; text-shadow: 0 0 .6em rgba(255,220,140,.6); }
  #verse span { transition: color .25s; }
  #controls { display: flex; gap: .8rem; }
  #controls button { font: .9rem system-ui, sans-serif; color: #e9e2cf; background: #15130f;
    border: 1px solid #3a352a; border-radius: 2rem; padding: .7rem 1.4rem; min-width: 7rem; }
  #controls button:active { background: #24201a; }
</style>
</head>
<body>
  <h1>Sonolumina</h1>
  <canvas id="dish" width="200" height="200" aria-hidden="true"></canvas>
  <p id="verse" aria-live="polite"></p>
  <div id="state"></div>
  <div id="labels"></div>
  <div id="controls">
    <button id="play" type="button">Begin</button>
    <button id="voice" type="button" aria-pressed="true">Voice on</button>
  </div>
<script type="module">
  import { LABELS } from './law/home.js';
  import { EMOTION_SOURCE, feeling } from './law/emotion.js';
  import { createEngine } from './form/engine.js';
  import { createDish } from './form/dish.js';
  import { createPlayer } from './form/player.js';
  import { createNarrator } from './form/narrator.js';
  import { parseRef, sung, isFinal, next } from './law/canon.js';

  const el = id => document.getElementById(id);
  const json = u => fetch(u).then(r => r.json());
  const [canon, cb] = await Promise.all([json('./data/canon.json'), json('./data/codebook/eng.json')]);
  // A book's text and feeling are fetched once, when first needed.
  const books = new Map();
  const book = b => {
    if (!books.has(b)) books.set(b, Promise.all([json('./data/bsb/' + canon[b][1]), json('./data/vad/' + canon[b][1])]));
    return books.get(b);
  };
  // A chapter as shown and as sung: headings are shown, never sung.
  const loadChapter = async ref => {
    const [bsb, vad] = await book(ref.book);
    const parts = bsb.c[ref.chapter - 1].map((_, i) => sung(bsb, ref.chapter, i + 1));
    return { ref, name: canon[ref.book][0], parts, text: parts.map(x => x.text), vadBook: vad, final: isFinal(canon, ref) };
  };
  // Any chapter opens from the address (?Psalms.23); Genesis 1 by default.
  const start = await loadChapter(parseRef(canon, location.search.slice(1)) || { book: 0, chapter: 1 });
  let cur = start;
  const here = ch => {
    cur = ch;
    document.title = `${ch.name} ${ch.ref.chapter} · Sonolumina`;
    history.replaceState(null, '', '?' + canon[ch.ref.book][1].replace(/\.json$/, '') + '.' + ch.ref.chapter);
  };
  here(start);
  const engine = createEngine();
  // Light for the season: hue from valence (cool blue at sorrow, warm gold at joy).
  let hue = 45;
  const hsl = (h, s, l) => {
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  };
  createDish(el('dish'), engine, () => hsl(hue, 0.55, 0.78));
  window.__sono = engine;   // for smoke tests

  let spans = [];
  const p = el('verse');
  const showVerse = (ch, v, words, E, k) => {
    if (k) {
      hue = k.hue;
      el('state').textContent = `${k.mode} · ${Math.round(k.bpm)} BPM · ${feeling(E)}`;
    }
    p.innerHTML = '';
    const head = ch.parts[v - 1] && ch.parts[v - 1].heading;
    if (head) { const h = document.createElement('span'); h.id = 'heading'; h.textContent = head; p.append(h); }
    spans = words.map((w, i) => {
      const s = document.createElement('span');
      s.textContent = w;
      p.append(s, i < words.length - 1 ? ' ' : '');
      return s;
    });
    const r = document.createElement('span');
    r.id = 'ref'; r.textContent = `${ch.name} ${ch.ref.chapter}:${v} · BSB`;
    // A verse the BSB leaves out (not in the oldest manuscripts) is named with the verse after it.
    if (v > 1 && !ch.text[v - 2].trim()) r.textContent += ` · ${ch.ref.chapter}:${v - 1} omitted (not in the oldest manuscripts)`;
    p.append(r);
  };
  // Before the first tap: Genesis 1 shows the darkness over the deep; any other chapter its first verse.
  { const v0 = start.ref.book === 0 && start.ref.chapter === 1 ? 2 : 1; showVerse(start, v0, start.text[v0 - 1].split(/\s+/)); }

  const narrator = createNarrator();
  const voiceBtn = el('voice'), playBtn = el('play');
  const setVoice = on => {
    narrator.on = on;
    voiceBtn.textContent = narrator.on ? 'Voice on' : 'Voice off';
    voiceBtn.setAttribute('aria-pressed', narrator.on);
  };
  if (!narrator.available) { voiceBtn.disabled = true; voiceBtn.textContent = 'No voice'; }
  voiceBtn.onclick = () => setVoice(!narrator.on);

  // Keep the screen awake while reading.
  let lock = null;
  const wake = async on => {
    try {
      if (on && !lock && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen');
      if (!on && lock) { await lock.release(); lock = null; }
    } catch { lock = null; }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && player && !player.paused && state === 'playing') { lock = null; wake(true); }
  });

  let player = null, state = 'ready';
  playBtn.onclick = () => {
    if (state === 'ready') {
      state = 'playing';
      playBtn.textContent = 'Pause';
      el('labels').innerHTML = [LABELS.F0, LABELS.WORD, EMOTION_SOURCE, LABELS.DISH].join('<br>');
      player = createPlayer({
        engine, lex: cb.lex, first: start,
        load: ref => { const n = next(canon, ref); return n ? loadChapter(n) : Promise.resolve(null); },
        narrating: () => narrator.on,
        onChapter: ch => here(ch),
        onVerse: (ch, v, words, E, k, vs) => {
          showVerse(ch, v, words, E, k);
          narrator.speak(words.join(' '), words.length / (vs.dur / 60));
        },
        onWord: (ch, v, i) => { spans.forEach((s, j) => s.className = j === i ? 'now' : ''); },
        onClose: () => {
          // Rest. The whole Bible has come home: the close on 110 Hz.
          spans.forEach(x => x.className = '');
          el('state').textContent = 'Amen · IV–I · home 110 Hz';
        },
        onEnd: () => { state = 'ready'; playBtn.textContent = 'Begin again'; wake(false); },
      });
      player.play();
      wake(true);
    } else if (state === 'playing') {
      state = 'paused'; playBtn.textContent = 'Resume';
      player.pause(); narrator.pause(); wake(false);
    } else if (state === 'paused') {
      state = 'playing'; playBtn.textContent = 'Pause';
      player.resume(); narrator.resume(); wake(true);
    }
  };
</script>
</body>
</html>
