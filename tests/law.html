<!doctype html>
<meta charset="utf-8">
<title>Sonolumina · Law tests</title>
<pre id="out">running…</pre>
<script type="module">
  import { F0, J0, chladniMode, chladni } from '../law/home.js';
  import { stem, tone, JUST } from '../law/codebook.js';
  import { scoreWords, scoreVerse, restAfter } from '../law/score.js';
  import { verseE, smooth, K, snapMode, modeOf, MODES } from '../law/emotion.js';
  import { scoreChapter } from '../law/chapter.js';
  import { chordR, progression, pivot, pc } from '../law/harmony.js';
  import { parseRef, next, prev, isFinal, sung, gIndex, chapterIndex, refAt } from '../law/canon.js';
  import { meanV, seasonHue } from '../law/seasons.js';
  import { afterText } from '../law/after.js';
  import { links, signature, swells } from '../law/links.js';
  const results = [];
  const check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail });
  const near = (a, b, tol) => Math.abs(a - b) <= tol;

  // Bessel J0 against tabulated values.
  check('J0(0) = 1', near(J0(0), 1, 1e-7));
  check('J0(1) = 0.7651977', near(J0(1), 0.7651977, 1e-6));
  check('J0 first zero at 2.404826', near(J0(2.404826), 0, 1e-6));
  check('J0(5) = -0.1775968', near(J0(5), -0.1775968, 1e-6));
  check('J0(10) = -0.2459358', near(J0(10), -0.2459358, 1e-6));

  // Stems: JavaScript must match the Python rules the codebook was built with.
  const fx = await (await fetch('./stems.json')).json();
  const wrong = Object.entries(fx).filter(([t, s]) => stem(t) !== s);
  check(`stem matches Python on ${Object.keys(fx).length} words`, wrong.length === 0, wrong.slice(0, 5).join(' | '));

  // Tones from the codebook, worked by hand from the Law.
  const lex = (await (await fetch('../data/codebook/eng.json')).json()).lex;
  const god = tone(lex, 'God');        // entry [5,0,3,3,4712,0] (frequency rank): step 5 = 4/3, octave 0
  check('God = 110 × 4/3 = 146.67 Hz', near(god.freq, 110 * 4 / 3, 1e-9), god.freq);
  check('God companions = 3/2 and 3/2 of its tone', near(god.partials[0].freq, 220, 1e-9) && near(god.partials[1].freq, 220, 1e-9));
  const beg = tone(lex, 'beginning'); // [7,1,0,0,...]: step 7 = 3/2, octave 1
  check('beginning = 110 × 3/2 × 2 = 330 Hz', near(beg.freq, 330, 1e-9), beg.freq);
  check('all six fields read', beg.count === 107 && beg.first === 0, JSON.stringify(beg));
  check('F0 is 110 Hz', F0 === 110);
  check('every tone lies on the just scale', Object.values(lex).every(e => e.length === 6 && JUST[e[0]] && e[1] >= 0 && e[1] <= 2));

  // Scoring a verse (Day 3).
  const gen = await (await fetch('../data/bsb/Genesis.json')).json();
  const s1 = scoreWords(lex, gen.c[0][0]);   // "In the beginning God created the heavens and the earth."
  check('Genesis 1:1 has 10 words, all with tones', s1.events.length === 10 && s1.events.every(e => e.tone));
  check('Genesis 1:1 lasts 10 eighths + 1 beat rest at the full stop = 6 beats', s1.beats === 6, s1.beats);
  check('rests: full stop 1, comma 0.5, none 0', restAfter('light.') === 1 && restAfter('void,') === 0.5 && restAfter('God') === 0);
  check('rest after a closing quote: “Let there be light,”', restAfter('light,”') === 0.5);
  check('word order kept', s1.events.map(e => e.word).join(' ') === gen.c[0][0]);

  // Emotion and K(E) (Day 4).
  const vad = await (await fetch('../data/vad/Genesis.json')).json();
  const E1 = verseE(vad, 1, 1);
  const raw = vad[0].slice(0, 6);       // read from the data, not typed: VVAADD
  check('Genesis 1:1 feeling read as stored ÷ 99', near(E1.v, +raw.slice(0, 2) / 99, 1e-12) && near(E1.a, +raw.slice(2, 4) / 99, 1e-12) && near(E1.d, +raw.slice(4, 6) / 99, 1e-12), raw);
  check('Genesis 1:1 mode = M[⌊5V⌋]', K(E1).mode === ['Aeolian', 'Dorian', 'Mixolydian', 'Ionian', 'Lydian'][Math.floor(5 * E1.v)], K(E1).mode);
  check('tempo = 54 + 30·A', near(K(E1).bpm, 54 + 30 * E1.a, 1e-9), K(E1).bpm);
  check('mode = M[⌊5V⌋], five even bands, by valence alone', modeOf({v:.19,d:1}) === 'Aeolian' && modeOf({v:.2}) === 'Dorian' && modeOf({v:.4}) === 'Mixolydian' && modeOf({v:.6,d:0}) === 'Ionian' && modeOf({v:.79}) === 'Ionian' && modeOf({v:.8,d:0}) === 'Lydian');
  check('V = 1 clamps to Lydian (Q9)', modeOf({v:1}) === 'Lydian');
  check('loudness rises with D, not A', near(K({v:.5,a:0,d:1}).loud, 1.25, 1e-12) && near(K({v:.5,a:1,d:0}).loud, 0.75, 1e-12));
  check('smoothing halves toward the last verse', near(smooth({v:1,a:1,d:1},{v:0,a:0,d:0}).v, .5, 1e-12));
  check('snap 16/15 → 9/8 in Ionian (nearer by log distance)', near(snapMode(110*16/15, 110, 'Ionian'), 110*9/8, 1e-9));
  check('snap 45/32 → 4/3 in Ionian, keeps octave', near(snapMode(440*45/32, 110, 'Ionian'), 440*4/3, 1e-9));
  check('snap 15/8 stays 15/8 in Ionian', near(snapMode(110*15/8, 110, 'Ionian'), 110*15/8, 1e-9));
  // The chapter as heard (smoothed feeling), Day 5.
  const ch = scoreChapter({ lex, text: gen.c[0], vadBook: vad, chapter: 1, final: true });
  const one = r => near(pc(r), 1, 1e-9);
  const inScale = (f, mode) => MODES[mode].some(m => near(m, pc(f / 110), 1e-9)) || near(pc(f / 110), 15 / 8, 1e-9);
  check('31 verses scored', ch.verses.length === 31);
  check('feeling is smoothed verse to verse', near(ch.verses[1].E.v, (verseE(vad, 1, 2).v + verseE(vad, 1, 1).v) / 2, 1e-12));
  check('every chord tone lies in its verse mode (15/8 on the cadential V; the Amen is the major IV, borrowed where needed)',
    ch.verses.every(vs => vs.bars.every(b => b.amen ? b.tones.every(f => [4/3, 5/3, 1].some(r => near(pc(f / 110), r, 1e-9))) : b.tones.every(f => inScale(f, vs.mode)))));
  check('every melody note and partial lies in its verse mode (15/8 allowed)',
    ch.verses.every(vs => vs.melody.every(n => inScale(n.freq, vs.mode) && n.partials.every(p => inScale(p.freq, vs.mode)))));
  check('every melody note sits in the register 523–1568 Hz × 2^(0.6(D−.5))',
    ch.verses.every(vs => vs.melody.every(n => n.freq >= 523 * vs.k.reg - 1e-6 && n.freq <= 1568 * vs.k.reg + 1e-6)));
  check('melody only on key words (fewer than 200 uses)',
    ch.verses.every(vs => vs.melody.filter(n => n.word != null).every(n => lex[stem(vs.words[n.word].word)][4] < 200)));
  check('progression ends V–I, chapter end IV–I', progression(4, 'I', false).slice(-2).join() === 'V,I' && progression(4, 'I', true).slice(-2).join() === 'IV,I');
  check('cadential V carries the leading tone 15/8 in Aeolian', chordR('Aeolian', 'V', true).some(r => near(pc(r), 15 / 8, 1e-12)));
  check('the Amen IV is the major IV (4/3, 5/3, 2) in every mode, Lydian included (Q13)',
    Object.keys(MODES).every(m => chordR(m, 'IV', false, true).every((r, i) => near(r, [4/3, 5/3, 2][i], 1e-12))));
  check('without the Amen, IV is built from the mode (Lydian: 45/32)', near(chordR('Lydian', 'IV')[0], 45 / 32, 1e-12));
  check('the last verse marks its IV bar as the Amen', ch.verses[30].bars[ch.verses[30].bars.length - 2].amen === true);

  // Chapters flow on (whole Bible): only the very end has the long close.
  const mid = scoreChapter({ lex, text: gen.c[0], vadBook: vad, chapter: 1 });
  const lastV = mid.verses[mid.verses.length - 1];
  check('a chapter that is not final has no close, only a breath of 2 beats', mid.close === null && near(mid.dur, lastV.at + lastV.dur + 2 * lastV.beat, 1e-9));
  check('the next chapter can carry the mode and melody on', mid.lastMode === lastV.mode && mid.melPrev > 0);

  // Omitted verses (BSB leaves 16 slots empty): no music, no time.
  const gap = scoreChapter({ lex, text: [gen.c[0][0], '', gen.c[0][2]], vadBook: vad, chapter: 1 });
  check('an omitted verse is marked, has no time and no notes', gap.verses[1].omitted === true && gap.verses[1].dur === 0 && !gap.verses[1].bars);
  check('the verse after an omission starts where the one before ended', near(gap.verses[2].at, gap.verses[0].at + gap.verses[0].dur + gap.verses[0].beat, 1e-9));
  const tail = scoreChapter({ lex, text: [gen.c[0][0], gen.c[0][1], ''], vadBook: vad, chapter: 1 });
  check('when the last slot is omitted, the last sung verse says the Amen', tail.verses[1].last === true && tail.verses[1].bars.slice(-2).map(b => b.chord).join() === 'IV,I');

  // A very short verse still comes home ("Jesus wept.").
  const wept = scoreChapter({ lex, text: ['Jesus wept.'], vadBook: ['505050'], chapter: 1 });
  const wv = wept.verses[0];
  check('"Jesus wept." has at least 2 bars, ends IV–I and on the home note', wv.bars.length >= 2 && wv.bars.slice(-2).map(b => b.chord).join() === 'IV,I' && one(wv.melody[wv.melody.length - 1].freq / 110));
  check('pivot Ionian → Mixolydian uses a shared chord', ['IV', 'vi', 'I'].includes(pivot('Ionian', 'Mixolydian')));


  // Res, the Resolution rule, on the chapter as heard (Day 7).
  check('every verse ends V–I, the last verse IV–I ("Amen")', ch.verses.every(vs => {
    const [a, b] = vs.bars.slice(-2).map(x => x.chord);
    return b === 'I' && a === (vs.last ? 'IV' : 'V');
  }));
  check('every cadential V carries the leading tone 15/8', ch.verses.filter(vs => !vs.last).every(vs => {
    const c = vs.bars[vs.bars.length - 2];
    return c.cad && c.tones.some(f => near(pc(f / 110), 15 / 8, 1e-9));
  }));
  check("every verse's last melody note is the home note (a power of 2 × 110 Hz)",
    ch.verses.every(vs => { const m = vs.melody[vs.melody.length - 1]; return m.res === 'tonic' && one(m.freq / 110); }));
  check("every verse's last bass note is the home note", ch.verses.every(vs => one(vs.bars[vs.bars.length - 1].bass / 110)));
  check('phrase-end melody notes are chord tones', ch.verses.every(vs => vs.melody.filter(n => n.res === 'phrase-end').every(n => {
    const b = vs.bars.find(x => n.t >= x.t - 1e-9 && n.t < x.t + x.dur - 1e-9) || vs.bars[vs.bars.length - 1];
    return b.tones.some(f => near(pc(n.freq / f), 1, 1e-9));
  })));
  check('the close: bass on 110 Hz itself, strings on the tonic chord, melody on home',
    ch.close.bass === 110 && ch.close.pad.every(f => chordR(ch.lastMode, 'I').some(r => near(pc(f / 110), pc(r), 1e-9))) && one(ch.close.melody / 110));

  // The canon (whole Bible).
  const canon = await (await fetch('../data/canon.json')).json();
  check('canon: 66 books, 1,189 chapters, 31,102 verse slots', canon.length === 66 && canon.reduce((n, b) => n + b[2].length, 0) === 1189 && canon.reduce((n, b) => n + b[2].reduce((x, y) => x + y, 0), 0) === 31102);
  const ps = parseRef(canon, 'Psalms.23'), so = parseRef(canon, 'SongofSolomon.2');
  check('parseRef reads "Psalms.23" and "SongofSolomon.2"', canon[ps.book][0] === 'Psalms' && ps.chapter === 23 && canon[so.book][0] === 'Song of Solomon' && so.chapter === 2);
  check('parseRef refuses Psalms.151 and nonsense', parseRef(canon, 'Psalms.151') === null && parseRef(canon, 'Hezekiah.1') === null && parseRef(canon, '') === null);
  const mal = parseRef(canon, 'Malachi.4'), rev = parseRef(canon, 'Revelation.22');
  check('next: Malachi 4 → Matthew 1; Revelation 22 → none (final)', canon[next(canon, mal).book][0] === 'Matthew' && next(canon, mal).chapter === 1 && next(canon, rev) === null && isFinal(canon, rev));
  check('prev: Genesis 1 → none; Matthew 1 → Malachi 4', prev(canon, { book: 0, chapter: 1 }) === null && prev(canon, next(canon, mal)).chapter === 4);
  check('gIndex: Genesis 1:1 = 0, Revelation 22:21 = 31,101', gIndex(canon, 0, 1, 1) === 0 && gIndex(canon, 65, 22, 21) === 31101);
  const psalms = await (await fetch('../data/bsb/Psalms.json')).json();
  const p23 = sung(psalms, 23, 1), p119 = sung(psalms, 119, 1);
  check('Psalm 23:1: heading shown, not sung', p23.heading === 'A Psalm of David.' && p23.text === 'The LORD is my shepherd; I shall not want.', JSON.stringify(p23));
  check('116 Psalms carry a heading; Psalm 119 has none', Object.keys(psalms.h).length === 116 && p119.heading === '' && p119.text === psalms.c[118][0]);

  // Links (Day 5): linked verses sound together.
  const genX = await (await fetch('../data/xref/Genesis.json')).json();
  const jn = canon.findIndex(b => b[0] === 'John');
  const jnX = await (await fetch('../data/xref/John.json')).json();
  const L1 = links(canon, genX, 0, 1, 1);
  check('Genesis 1:1 has links, strongest first, α = votes/max (first = 1)', L1.length > 0 && L1.length <= 8 && L1[0].alpha === 1 && L1.every((l, i) => i === 0 || l.votes <= L1[i - 1].votes) && L1.every(l => near(l.alpha, l.votes / L1[0].votes, 1e-12)));
  check('a link to a later verse comes from the right (+0.7)', L1.every(l => l.dir === 0.7));
  const LJ = links(canon, jnX, jn, 1, 1);
  check('John 1:1 → Genesis 1:1 comes from the left (−0.7)', LJ.some(l => l.book === 0 && l.c === 1 && l.v === 1 && l.dir === -0.7));
  check('a verse with no links has none', links(canon, {}, 0, 1, 1).length === 0);
  const sig = signature(lex, gen.c[0][0], 'Dorian');
  check('signature: at most 3 tones, every one in the mode', sig.length === 3 && sig.every(f => MODES.Dorian.some(m => near(pc(f / 110), m, 1e-9)) || near(pc(f / 110), 1, 1e-9)), sig.join());
  const sw = swells([{ alpha: 1 }, { alpha: 0.5 }, { alpha: 0.25 }], 8);
  check('swells: evenly spread, 2 s then 1.2 s, gain 0.4 + 0.6α', sw.map(x => x.t).join() === '2,4,6' && sw[0].len === 2 && sw[1].len === 1.2 && near(sw[1].gain, 0.7, 1e-12));

  // Navigation (Day 6): a verse in the address, and a chapter's place among all 1,189.
  const j11 = parseRef(canon, 'John.1.1');
  check('parseRef reads "John.1.1" (verse) and leaves the verse out of "Psalms.23"', j11 && j11.book === jn && j11.chapter === 1 && j11.verse === 1 && ps.verse === undefined, JSON.stringify(j11));
  check('parseRef refuses a verse past the end (John 1:52)', parseRef(canon, 'John.1.52') === null);
  check('chapterIndex: Genesis 1 = 0, Revelation 22 = 1,188', chapterIndex(canon, { book: 0, chapter: 1 }) === 0 && chapterIndex(canon, rev) === 1188);
  const r49 = refAt(canon, 49), r50 = refAt(canon, 50), r1188 = refAt(canon, 1188);
  check('refAt: 49 = Genesis 50, 50 = Exodus 1, 1,188 = Revelation 22', r49.book === 0 && r49.chapter === 50 && r50.book === 1 && r50.chapter === 1 && r1188.book === 65 && r1188.chapter === 22);

  // Seasons (Day 4): each chapter's mean feeling, coloured by the light's own hue rule.
  const gvad = await (await fetch('../data/vad/Genesis.json')).json();
  const seasons = await (await fetch('../data/seasons.json')).json();
  check('seasons: one mean V per chapter (1,189), each 0..1', seasons.length === 1189 && seasons.every(x => x >= 0 && x <= 1));
  check('seasons[0] is the mean V of Genesis 1 as stored', near(seasons[0], meanV(gvad[0]), 1e-3), [seasons[0], meanV(gvad[0])]);
  check('a season is coloured as the light: hue = 210 − 170·V', seasonHue(0.5) === K({ v: 0.5, a: 0.5, d: 0.5 }).hue && seasonHue(1) === 40);

  // After the Word (SPIRIT §11): history is silent; only its tied verse sounds, by the same Law.
  const history = await (await fetch('../data/history.json')).json();
  check('history: entries in date order within each thread, each with a tied verse, sources and "not Scripture" label', history.entries.length >= 1 && history.threads.length >= 1 && history.entries.every((e, i) => e.ref && e.sources.length && history.threads[e.thread] && (i === 0 || e.thread > history.entries[i - 1].thread || (e.thread === history.entries[i - 1].thread && e.year >= history.entries[i - 1].year))) && /not Scripture/.test(history.label));
  const romans = await (await fetch('../data/bsb/Romans.json')).json();
  const at = afterText(romans, 10, 14);
  check('afterText: only the tied verse is sung, the rest is silent', at.length === romans.c[9].length && at.filter(t => t).length === 1 && at[13] === sung(romans, 10, 14).text);
  const hc = scoreChapter({ lex, text: at, vadBook: (await (await fetch('../data/vad/Romans.json')).json()), chapter: 10 });
  const sungH = hc.verses.filter(x => !x.omitted);
  check('a history entry sounds one verse, starting at once and ending on the Amen (IV–I)', sungH.length === 1 && sungH[0].verse === 14 && sungH[0].at === 0 && sungH[0].bars[sungH[0].bars.length - 2].amen && sungH[0].bars[sungH[0].bars.length - 1].chord === 'I');

  // Chladni (Day 5).
  const [cn, cm] = chladniMode(5);   // 5·5 = 25 = 5² + 0² or 4² + 3²; first found wins
  check('Chladni mode for ratio 5: n² + m² = 25', cn * cn + cm * cm === 25, [cn, cm]);
  check('Chladni figure is zero on the diagonal (n ≠ m)', near(chladni(3, 1, 0.3, 0.3), 0, 1e-12));

  const pass = results.filter(r => r.ok).length;
  document.getElementById('out').textContent =
    results.map(r => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.ok ? '' : '  ' + r.detail}`).join('\n') +
    `\n\n${pass}/${results.length} passed`;
  window.__law = { pass, total: results.length, results };
</script>
